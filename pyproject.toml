[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-speech-enhancement"
version = "0.1.0"
description = "Low-latency speech denoising and dereverberation baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["realtime_speech_enhancement*"]
